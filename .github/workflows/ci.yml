name: CI

# Runs on every pull request and on pushes to main. The job names below are
# what branch protection requires, so do not rename them without updating the
# protection rule: Settings -> Branches -> main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / JS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          # The desktop checks never launch Electron, so the ~100 MB binary
          # download would only slow the job down. `--ignore-scripts` also
          # skips the native `usocket` build, which these checks do not need.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Syntax check
        run: |
          set -euo pipefail
          files=(main.js preload.js src/*.js services/*.js services/*.mjs scripts/*.js)
          node --check "${files[@]}"

      - name: File history and QR checks
        run: npm run check:history

  android:
    name: Android / unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: companion-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install the SDK platform the app compiles against
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: companion-android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: companion-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
