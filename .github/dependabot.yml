version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
    ignore:
      # The scrcpy/adb libraries are pinned and speak a specific protocol.
      # Bump them deliberately, with a device test, not by a bot.
      - dependency-name: "@yume-chan/*"

  - package-ecosystem: gradle
    directory: /companion-android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
